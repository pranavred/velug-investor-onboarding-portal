services:
  portal:
    build: .
    ports:
      - '3000:3000'
    environment:
      APP_NAME: ${APP_NAME:-Velug Investor Onboarding}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LIVE_AI_ENABLED: ${LIVE_AI_ENABLED:-false}
      REVIEW_DRAFTS_ENABLED: ${REVIEW_DRAFTS_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_CLASSIFICATION_MODEL: ${ANTHROPIC_CLASSIFICATION_MODEL:-claude-opus-5-5}
      ANTHROPIC_EXTRACTION_MODEL: ${ANTHROPIC_EXTRACTION_MODEL:-claude-fable-5-1}
      ANTHROPIC_REVIEW_MODEL: ${ANTHROPIC_REVIEW_MODEL:-claude-opus-5-5}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUOTA_NAMESPACE: ${QUOTA_NAMESPACE:-investor-onboarding}
      GLOBAL_CALLS_PER_HOUR: ${GLOBAL_CALLS_PER_HOUR:-20}
      SESSION_CALLS_PER_HOUR: ${SESSION_CALLS_PER_HOUR:-5}
  redis:
    image: redis:7.4.2-bookworm
    profiles: [live]
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - quota-data:/data
volumes:
  quota-data:
